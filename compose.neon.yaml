# Run with: docker compose -f compose.neon.yaml up -d --build web
# DATABASE_URL must point to Neon in the ignored .env file.
services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    command: [sh, -c, 'DATABASE_URL="$${DATABASE_URL_UNPOOLED:-$$DATABASE_URL}" python -m flask --app app init-db && waitress-serve --host=0.0.0.0 --port=8000 --call app:create_app']
