services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mypath}
      POSTGRES_USER: ${POSTGRES_USER:-mypath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mypath}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mypath}
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, 'python -m flask --app app init-db && waitress-serve --host=0.0.0.0 --port=8000 --call app:create_app']
volumes:
  postgres_data:
